[project]
name = "kosh"
version = "0.1.0"
description = "Indian market intelligence corpus — append-only observation store built on Webcmd"
requires-python = ">=3.11"
# The SQLite path has zero runtime dependencies on purpose: `kosh verify-foundation`
# and the whole test suite must run on a clean machine with nothing but Python.
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
kosh = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "sources"]
python_files = ["test_*.py"]
filterwarnings = ["error::DeprecationWarning"]
